[project]
name = "voice-agent"
version = "0.1.0"
description = "Real-time spoken assistant for Claude (Pipecat, local-first, tool-enabled)"
# 3.13 OK: torch/onnxruntime/ctranslate2 all ship cp313 wheels. The old <3.13 cap was solely
# `speexdsp-ns` (cp312-only wheel) — now an optional [speex] extra (off-by-default feature, graceful
# fallback). 3.14 resolves too but is unverified; revisit the cap once 3.14 is install-tested.
requires-python = ">=3.12,<3.14"

# Pipecat is PINNED so the local-fork escape hatch below has a stable base and the
# SmartTurn V2->V3 / extras-rename drift can't recur silently. Bump deliberately.
dependencies = [
    # local-smart-turn DROPPED (#72): it pulled torch/torchaudio/transformers/coremltools + the whole
    # nvidia/cuda/triton stack (~5G) that nothing here runs. The default turn analyzer is
    # LocalSmartTurnAnalyzerV3 (main.py) = pure-onnx (numpy/onnxruntime/soxr), bundled onnx in pipecat
    # core — present without this extra. Torch is 100% runtime-dead here. Re-add ONLY if a torch-based
    # V2/CoreML analyzer is ever wanted (then CPU-pin torch — see project-torch-slim-72 fallback).
    "pipecat-ai[anthropic,silero,whisper,local,kokoro]==1.3.0",
    "onnxruntime",
    "python-dotenv",
    "loguru",
    "httpx",                   # brain client + RemoteSTTService (async, non-blocking) — was transitive
    "aiohttp",                 # stt_service/server.py (standalone STT service) — was transitive via pipecat
    "websockets>=13.1,<16.0",  # relaxed from >=16.0 (vestigial — nothing imports it) for pipecat-ai-tail compat
    "openwakeword>=0.4.0",
    "nanowakeword>=2.1.3",  # alt wake engine (WAKE_WORD_ENGINE=nano); durable wake-over-music model
    "pvporcupine>=4.0.0",   # alt wake engine (WAKE_WORD_ENGINE=porcupine); instant robust custom keyword
    "pipecat-ai-tail>=0.0.5",
]

[project.optional-dependencies]
# LLM-swap extras — not installed by default. Enable with: uv sync --extra swap
# NB: there is no `ollama` extra at 1.3.0 — OLLamaLLMService rides on [openai]
# (it just points an OpenAI-compatible client at the Ollama base_url).
swap = [
    "pipecat-ai[openai]==1.3.0",
]
# Speex noise suppression (openWakeWord pre-filter). OFF by default in code (WAKE_WORD_SPEEX_NS=1 to
# enable; config.py falls back gracefully if absent). Its only wheel is cp312 → kept OUT of core so the
# project isn't pinned to 3.12. Install with `uv sync --extra speex` on 3.12 (builds from sdist elsewhere).
speex = [
    "speexdsp-ns>=0.1.2",
]
# piper TTS — a FAST local CPU TTS for weak thin-client hardware (a Pi-4 is ~16s/utterance on Kokoro).
# Per-device by design: install ONLY where TTS_PROVIDER=piper (the Pi satellite) with `uv sync --extra piper`;
# EM keeps Kokoro and never installs this. config.py imports PiperTTSService lazily, so it's absent-safe.
piper = [
    "pipecat-ai[piper]==1.3.0",
]
# mDNS LAN-brain discovery (voice_agent_install.discovery + the boot re-resolve). Installed BY DEFAULT for
# the `satellite` role (bootstrap.sh adds `--extra mdns` unless `--no-mdns`) — a satellite's job is to find
# its brain, so "fire it up and it finds the brain" is the default, not opt-in. Still an EXTRA, not core:
# `run.sh` is `uv run python main.py`, which would re-resolve against this file on every launch if it were
# core; keeping it an extra means the boot path carries no package resolve, and a box that does not want
# discovery (voice-host, or a satellite with `--no-mdns`) omits it. discovery.py imports zeroconf lazily
# inside a try, so its absence degrades to "no mDNS, manual host only" and never raises.
mdns = [
    "zeroconf>=0.132",
]

[dependency-groups]
# Installed by default with `uv sync`. Safety unit tests (Phase 3.5).
dev = [
    "pytest",
]

[tool.uv]
# This is an application, not a library — don't try to build/install it as a package.
package = false

# --- Local fork escape hatch (documented, default OFF) ---
# Don't fork preemptively; ship on the pinned PyPI release above. When you need to
# patch Pipecat (fix a bug, set a breakpoint, hack a service), clone your fork to
# ./vendor/pipecat (gitignored or a submodule) and uncomment the stanza below — edits
# there then take effect live (editable). `uv sync` to switch; re-comment to return.
# Alternative for reproducible committed fixes:
#   pipecat-ai = { git = "https://github.com/<you>/pipecat", branch = "my-fixes" }
# [tool.uv.sources]
# pipecat-ai = { path = "./vendor/pipecat", editable = true }
